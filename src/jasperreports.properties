# Force JasperReports to compile report expression classes with the real
# javac (via com.sun.tools.javac) instead of its bundled Eclipse JDT compiler
# (lib/JasperReportsNonDistrib/jdt-compiler-3.1.1.jar, ~2006). That embedded
# compiler cannot resolve java.time.LocalDateTime, which java.sql.Timestamp
# references internally under JDK 8+, and fails on any report expression that
# touches java.sql.Timestamp.
net.sf.jasperreports.compiler.java=net.sf.jasperreports.engine.design.JRJavacCompiler
